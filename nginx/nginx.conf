server {
    listen 80;
    server_name localhost;

    # Отдаем статику
    location /static/ {
        alias /app/staticfiles/;   # Важно: / на конце!
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
    }

    # (Не обязательно, но полезно) Отдача медиафайлов, если появятся
    location /media/ {
        alias /app/media/;
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
    }

    # Остальные запросы — на Django backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;    # Если вдруг долгий ответ
        client_max_body_size 20M;  # Если будут большие POST-запросы
    }
}
